<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Games</title>
    <style>
        :root {
            --ink: #172033;
            --paper: #fffdf7;
            --accent: #ff7a59;
            --accent-dark: #d94f32;
            --correct: #16886b;
            --wrong: #db4c64;
            --shadow: 0 18px 50px rgba(23, 32, 51, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 122, 89, 0.18), transparent 24%),
                radial-gradient(circle at 85% 80%, rgba(22, 136, 107, 0.15), transparent 22%),
                #f2eee4;
        }

        .game {
            width: min(900px, 100%);
            display: grid;
            grid-template-columns: minmax(260px, 0.85fr) minmax(320px, 1.15fr);
            overflow: hidden;
            background: var(--paper);
            border: 2px solid var(--ink);
            border-radius: 24px;
            box-shadow: var(--shadow);
        }

        .app {
            width: min(900px, 100%);
        }

        .game-switcher {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .game-tab {
            padding: 10px 18px;
            border-radius: 999px;
            background: var(--paper);
            color: var(--ink);
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--ink);
        }

        .game-tab.active {
            background: var(--accent);
            color: white;
        }

        .game-screen {
            display: none;
        }

        .game-screen.active {
            display: grid;
        }

        .rps {
            grid-template-columns: 1fr;
            min-height: 450px;
            text-align: center;
        }

        .rps-content {
            padding: 38px;
        }

        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 36px;
            margin: 20px 0 24px;
            font-family: "Trebuchet MS", sans-serif;
            font-size: 1.15rem;
            font-weight: 900;
        }

        .rps-choices {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            max-width: 520px;
            margin: 0 auto;
        }

        .rps-choice {
            min-height: 120px;
            border-radius: 16px;
            background: white;
            font-size: clamp(2.2rem, 8vw, 4rem);
            cursor: pointer;
            box-shadow: 0 6px 0 var(--ink);
            transition: transform 100ms, box-shadow 100ms;
        }

        .rps-choice:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 var(--ink);
        }

        .rps-choice:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 var(--ink);
        }

        .battle {
            min-height: 78px;
            display: grid;
            place-items: center;
            margin: 20px 0 8px;
            font-family: "Trebuchet MS", sans-serif;
            font-size: 1.15rem;
            font-weight: 900;
        }

        .rps-reset {
            display: inline-block;
            width: auto;
            margin: 10px auto 0;
            padding: 12px 28px;
        }

        .reset.rps-reset {
            display: inline-block;
        }

        .drawing {
            min-height: 450px;
            display: grid;
            place-items: center;
            padding: 30px;
            background: #dceadf;
            border-right: 2px solid var(--ink);
        }

        svg {
            width: min(300px, 100%);
            height: auto;
        }

        .figure-part {
            opacity: 0;
            transition: opacity 180ms ease;
        }

        .figure-part.visible {
            opacity: 1;
        }

        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 42px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(2.2rem, 7vw, 4.5rem);
            line-height: 0.9;
            letter-spacing: -0.06em;
        }

        .status {
            min-height: 24px;
            margin: 12px 0 28px;
            color: #596176;
            font-family: "Trebuchet MS", sans-serif;
            font-weight: 700;
        }

        .word {
            min-height: 75px;
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            gap: 8px;
            margin-bottom: 28px;
        }

        .letter {
            width: clamp(28px, 6vw, 42px);
            height: 48px;
            display: grid;
            place-items: center;
            border-bottom: 3px solid var(--ink);
            font-family: "Trebuchet MS", sans-serif;
            font-size: clamp(1.35rem, 4vw, 2rem);
            font-weight: 900;
            text-transform: uppercase;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 7px;
        }

        button {
            appearance: none;
            border: 2px solid var(--ink);
            font-family: "Trebuchet MS", sans-serif;
        }

        .key {
            aspect-ratio: 1;
            min-width: 0;
            border-radius: 8px;
            background: white;
            color: var(--ink);
            font-size: clamp(0.75rem, 2vw, 1rem);
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--ink);
            transition: transform 100ms, box-shadow 100ms, background 100ms;
        }

        .key:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 0 var(--ink);
        }

        .key:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--ink);
        }

        .key.correct {
            background: #bce6d5;
            color: var(--correct);
        }

        .key.wrong {
            background: #f5bec7;
            color: var(--wrong);
        }

        .key:disabled {
            cursor: default;
        }

        .reset {
            display: none;
            width: 100%;
            margin-top: 20px;
            padding: 13px 18px;
            border-radius: 10px;
            background: var(--accent);
            color: white;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--accent-dark);
        }

        .reset.visible {
            display: block;
        }

        @media (max-width: 720px) {
            body {
                padding: 12px;
            }

            .game {
                grid-template-columns: 1fr;
            }

            .drawing {
                min-height: 300px;
                border-right: 0;
                border-bottom: 2px solid var(--ink);
            }

            svg {
                max-height: 260px;
            }

            .content {
                padding: 28px 20px;
            }

            .keyboard {
                grid-template-columns: repeat(7, 1fr);
            }

            .rps-choices {
                gap: 8px;
            }

            .rps-choice {
                min-height: 90px;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <nav class="game-switcher" aria-label="Choose a game">
            <button class="game-tab active" type="button" data-game="hangman">Hangman</button>
            <button class="game-tab" type="button" data-game="rps">Rock Paper Scissors</button>
        </nav>

        <section class="game game-screen active" id="hangman-screen">
        <section class="drawing" aria-label="Hangman drawing">
            <svg viewBox="0 0 300 330" role="img" aria-label="Hangman">
                <g fill="none" stroke="#172033" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M35 305H265"/>
                    <path d="M75 305V25H220"/>
                    <path d="M220 25V65"/>
                    <path d="M75 65H130"/>
                    <circle class="figure-part" cx="220" cy="96" r="31"/>
                    <path class="figure-part" d="M220 127V225"/>
                    <path class="figure-part" d="M220 150L175 190"/>
                    <path class="figure-part" d="M220 150L265 190"/>
                    <path class="figure-part" d="M220 225L180 275"/>
                    <path class="figure-part" d="M220 225L260 275"/>
                </g>
            </svg>
        </section>

        <section class="content">
            <h1>Hangman</h1>
            <p class="status" id="status" aria-live="polite">Choose a letter</p>
            <div class="word" id="word" aria-label="Hidden word"></div>
            <div class="keyboard" id="keyboard" aria-label="Letter keyboard"></div>
            <button class="reset" id="reset" type="button">Play again</button>
        </section>
        </section>

        <section class="game rps game-screen" id="rps-screen">
            <div class="rps-content">
                <h1>Rock Paper Scissors</h1>
                <div class="scoreboard" aria-live="polite">
                    <span>You: <strong id="player-score">0</strong></span>
                    <span>Computer: <strong id="computer-score">0</strong></span>
                </div>
                <div class="battle" id="battle" aria-live="polite">Choose your move</div>
                <div class="rps-choices">
                    <button class="rps-choice" type="button" data-choice="rock" aria-label="Rock">✊</button>
                    <button class="rps-choice" type="button" data-choice="paper" aria-label="Paper">✋</button>
                    <button class="rps-choice" type="button" data-choice="scissors" aria-label="Scissors">✌️</button>
                </div>
                <button class="reset rps-reset" id="rps-reset" type="button">Reset score</button>
            </div>
        </section>
    </main>

    <script>
        const gameTabs = document.querySelectorAll(".game-tab");
        const gameScreens = document.querySelectorAll(".game-screen");

        gameTabs.forEach(tab => {
            tab.addEventListener("click", () => {
                gameTabs.forEach(item => item.classList.remove("active"));
                gameScreens.forEach(screen => screen.classList.remove("active"));
                tab.classList.add("active");
                document.getElementById(`${tab.dataset.game}-screen`).classList.add("active");
            });
        });

        const words = [
            "javascript",
            "keyboard",
            "hangman",
            "developer",
            
            "computer",
            "internet",
            "program",
            "chocolate",
            "adventure",
            "notebook",
            "sunshine",
            "mountain"
        ];

        const alphabet = "abcdefghijklmnopqrstuvwxyz";
        const maxWrongGuesses = 6;
        let word = "";
        let guessedLetters = new Set();
        let wrongGuesses = 0;
        let gameOver = false;

        const wordElement = document.getElementById("word");
        const keyboardElement = document.getElementById("keyboard");
        const statusElement = document.getElementById("status");
        const resetButton = document.getElementById("reset");
        const figureParts = document.querySelectorAll(".figure-part");

        function startGame() {
            word = words[Math.floor(Math.random() * words.length)];
            guessedLetters = new Set();
            wrongGuesses = 0;
            gameOver = false;
            statusElement.textContent = "Choose a letter";
            resetButton.classList.remove("visible");

            figureParts.forEach(part => part.classList.remove("visible"));
            keyboardElement.replaceChildren();

            for (const letter of alphabet) {
                const key = document.createElement("button");
                key.type = "button";
                key.className = "key";
                key.textContent = letter;
                key.setAttribute("aria-label", `Guess ${letter}`);
                key.addEventListener("click", () => guessLetter(letter));
                keyboardElement.appendChild(key);
            }

            renderWord();
        }

        function renderWord() {
            wordElement.replaceChildren();

            for (const letter of word) {
                const tile = document.createElement("span");
                tile.className = "letter";
                tile.textContent = guessedLetters.has(letter) ? letter : "";
                wordElement.appendChild(tile);
            }
        }

        function guessLetter(letter) {
            if (gameOver || guessedLetters.has(letter)) {
                return;
            }

            guessedLetters.add(letter);
            const key = [...keyboardElement.children].find(
                button => button.textContent === letter
            );

            if (word.includes(letter)) {
                key.classList.add("correct");
                statusElement.textContent = "Good guess!";
            } else {
                key.classList.add("wrong");
                wrongGuesses++;
                figureParts[wrongGuesses - 1].classList.add("visible");
                statusElement.textContent = `${maxWrongGuesses - wrongGuesses} tries left`;
            }

            key.disabled = true;
            renderWord();
            checkGameState();
        }

        function checkGameState() {
            const wordComplete = [...word].every(letter => guessedLetters.has(letter));

            if (wordComplete) {
                gameOver = true;
                statusElement.textContent = `You won! The word was "${word}".`;
                resetButton.classList.add("visible");
            } else if (wrongGuesses >= maxWrongGuesses) {
                gameOver = true;
                statusElement.textContent = `You lost! The word was "${word}".`;
                [...word].forEach(letter => guessedLetters.add(letter));
                renderWord();
                resetButton.classList.add("visible");
            }
        }

        document.addEventListener("keydown", event => {
            if (!document.getElementById("hangman-screen").classList.contains("active")) {
                return;
            }
            const letter = event.key.toLowerCase();
            if (/^[a-z]$/.test(letter)) {
                guessLetter(letter);
            }
        });

        resetButton.addEventListener("click", startGame);
        startGame();

        let playerScore = 0;
        let computerScore = 0;
        const rpsChoices = ["rock", "paper", "scissors"];
        const rpsSymbols = {
            rock: "✊",
            paper: "✋",
            scissors: "✌️"
        };
        const playerScoreElement = document.getElementById("player-score");
        const computerScoreElement = document.getElementById("computer-score");
        const battleElement = document.getElementById("battle");

        document.querySelectorAll(".rps-choice").forEach(button => {
            button.addEventListener("click", () => playRps(button.dataset.choice));
        });

        document.getElementById("rps-reset").addEventListener("click", () => {
            playerScore = 0;
            computerScore = 0;
            playerScoreElement.textContent = "0";
            computerScoreElement.textContent = "0";
            battleElement.textContent = "Choose your move";
        });

        function playRps(playerChoice) {
            const computerChoice = rpsChoices[Math.floor(Math.random() * rpsChoices.length)];
            let result;

            if (playerChoice === computerChoice) {
                result = "It's a draw!";
            } else if (
                (playerChoice === "rock" && computerChoice === "scissors") ||
                (playerChoice === "paper" && computerChoice === "rock") ||
                (playerChoice === "scissors" && computerChoice === "paper")
            ) {
                playerScore++;
                result = "You win!";
            } else {
                computerScore++;
                result = "Computer wins!";
            }

            playerScoreElement.textContent = playerScore;
            computerScoreElement.textContent = computerScore;
            battleElement.textContent =
                `${rpsSymbols[playerChoice]} vs ${rpsSymbols[computerChoice]} — ${result}`;
        }
    </script>
</body>
</html>
